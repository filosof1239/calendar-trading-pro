<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Calendar Trading Pro</title>
    <!-- Підключення Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Підключення бібліотеки Chart.js для побудови графіків -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Підключення маніфесту -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-2 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Шапка -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6 sm:mb-8 border-b border-slate-800 pb-4 gap-3">
            <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
                📈 <span data-i18n="title">Calendar Trading Pro</span>
            </h1>
            <div class="flex flex-wrap gap-2 sm:gap-4 items-center justify-center">
                <!-- Вибір валюти / крипти -->
                <select id="currencySelect" class="bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs sm:text-sm focus:outline-none focus:border-blue-500 text-emerald-400 font-medium">
                    <optgroup label="Fiat Currencies">
                        <option value="$" selected>USD ($)</option>
                        <option value="€">EUR (€)</option>
                        <option value="£">GBP (£)</option>
                        <option value="¥">JPY (¥)</option>
                        <option value="₣">CHF (₣)</option>
                        <option value="A$">AUD (A$)</option>
                        <option value="C$">CAD (C$)</option>
                        <option value="CN¥">CNY (CN¥)</option>
                        <option value="kr">SEK (kr)</option>
                        <option value="NZ$">NZD (NZ$)</option>
                    </optgroup>
                    <optgroup label="Cryptocurrencies">
                        <option value="USDT">USDT</option>
                        <option value="BTC">BTC</option>
                        <option value="ETH">ETH</option>
                        <option value="SOL">SOL</option>
                        <option value="BNB">BNB</option>
                        <option value="XRP">XRP</option>
                        <option value="ADA">ADA</option>
                        <option value="DOGE">DOGE</option>
                        <option value="AVAX">AVAX</option>
                        <option value="DOT">DOT</option>
                    </optgroup>
                </select>

                <!-- Вибір європейських мов -->
                <select id="langSelect" class="bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs sm:text-sm focus:outline-none focus:border-blue-500 text-blue-400 font-medium max-h-48 overflow-y-auto">
                    <option value="en" selected>English (English)</option>
                    <option value="uk">Українська (Ukrainian)</option>
                    <option value="sq">Shqip (Albanian)</option>
                    <option value="hy">Հայերեն (Armenian)</option>
                    <option value="az">Azərbaycan (Azerbaijani)</option>
                    <option value="eu">Euskara (Basque)</option>
                    <option value="be">Беларуская (Belarusian)</option>
                    <option value="bs">Bosanski (Bosnian)</option>
                    <option value="bg">Български (Bulgarian)</option>
                    <option value="hr">Hrvatski (Croatian)</option>
                    <option value="cs">Čeština (Czech)</option>
                    <option value="da">Dansk (Danish)</option>
                    <option value="nl">Nederlands (Dutch)</option>
                    <option value="et">Eesti (Estonian)</option>
                    <option value="fi">Suomi (Finnish)</option>
                    <option value="fr">Français (French)</option>
                    <option value="ka">ქართული (Georgian)</option>
                    <option value="de">Deutsch (German)</option>
                    <option value="el">Ελληνικά (Greek)</option>
                    <option value="hu">Magyar (Hungarian)</option>
                    <option value="is">Íslenska (Icelandic)</option>
                    <option value="ga">Gaeilge (Irish)</option>
                    <option value="it">Italiano (Italian)</option>
                    <option value="lv">Latviešu (Latvian)</option>
                    <option value="lt">Lietuvių (Lithuanian)</option>
                    <option value="lb">Lëtzebuergesch (Luxembourgish)</option>
                    <option value="mk">Македонски (Macedonian)</option>
                    <option value="mt">Malti (Maltese)</option>
                    <option value="no">Norsk (Norwegian)</option>
                    <option value="pl">Polski (Polish)</option>
                    <option value="pt">Português (Portuguese)</option>
                    <option value="ro">Română (Romanian)</option>
                    <option value="ru">Русский (Russian)</option>
                    <option value="sr">Српски (Serbian)</option>
                    <option value="sk">Slovenčina (Slovak)</option>
                    <option value="sl">Slovenščina (Slovenian)</option>
                    <option value="es">Español (Spanish)</option>
                    <option value="sv">Svenska (Swedish)</option>
                    <option value="tr">Türkçe (Turkish)</option>
                    <option value="cy">Cymraeg (Welsh)</option>
                </select>

                <button id="openChartBtn" class="bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/50 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-colors flex items-center gap-1.5">
                    📊 <span data-i18n="equityCurve">Equity Curve</span>
                </button>
                <div class="flex items-center gap-1 bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs sm:text-sm">
                    <span class="text-slate-400"><span data-i18n="balance">Balance</span> (<span class="currSymbol">$</span>):</span>
                    <input type="number" id="startBalanceInput" value="1000" class="bg-transparent text-slate-100 font-bold w-20 text-right focus:outline-none">
                </div>
                
                <!-- Перемикач режиму перегляду (Місяць / Тиждень) -->
                <div class="flex bg-slate-900 border border-slate-700 rounded overflow-hidden">
                    <button id="viewMonthBtn" class="px-2.5 py-1.5 text-xs font-semibold bg-blue-600 text-white transition-colors" data-i18n="viewMonth">Month</button>
                    <button id="viewWeekBtn" class="px-2.5 py-1.5 text-xs font-semibold text-slate-400 hover:text-white transition-colors" data-i18n="viewWeek">Week</button>
                </div>

                <select id="monthSelect" class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:border-blue-500">
                    <option value="0" data-i18n="m0">January</option>
                    <option value="1" data-i18n="m1">February</option>
                    <option value="2" data-i18n="m2">March</option>
                    <option value="3" data-i18n="m3">April</option>
                    <option value="4" data-i18n="m4">May</option>
                    <option value="5" data-i18n="m5">June</option>
                    <option value="6" data-i18n="m6">July</option>
                    <option value="7" data-i18n="m7">August</option>
                    <option value="8" data-i18n="m8">September</option>
                    <option value="9" selected data-i18n="m9">October</option>
                    <option value="10" data-i18n="m10">November</option>
                    <option value="11" data-i18n="m11">December</option>
                </select>
                <input type="number" id="yearInput" value="2026" class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs sm:text-sm w-20 text-center focus:outline-none focus:border-blue-500">
            </div>
        </header>

        <!-- Статистика за період -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-4 mb-6 sm:mb-8">
            <div class="bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-xl shadow-lg text-center sm:text-left">
                <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider" data-i18n="currBalance">Current Balance</p>
                <p id="currentBalance" class="text-lg sm:text-2xl font-bold mt-1 text-blue-400">1000.00</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-xl shadow-lg text-center sm:text-left">
                <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider" id="pnlLabelTitle">Total P&L</p>
                <p id="totalPnl" class="text-lg sm:text-2xl font-bold mt-1 text-slate-100">0.00</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-xl shadow-lg text-center sm:text-left">
                <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider" data-i18n="winLossDays">Green / Red Days</p>
                <p class="text-lg sm:text-2xl font-bold mt-1"><span id="winDays" class="text-emerald-400">0</span> / <span id="lossDays" class="text-rose-400">0</span></p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-xl shadow-lg text-center sm:text-left">
                <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider" id="winRateLabelTitle">Winrate Days</p>
                <p id="winRate" class="text-lg sm:text-2xl font-bold mt-1 text-blue-400">0%</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">
            <!-- Швидке введення та бекап -->
            <div class="space-y-6">
                <div class="bg-slate-900 border border-slate-800 p-4 sm:p-6 rounded-2xl shadow-xl">
                    <h2 class="text-base sm:text-lg font-semibold mb-4 text-blue-400" data-i18n="recordDay">➕ Log Day</h2>
                    <form id="tradeForm" class="space-y-3 sm:space-y-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1" data-i18n="date">Date</label>
                            <input type="date" id="tradeDate" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs sm:text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1"><span data-i18n="netPnl">Net P&L</span> (<span class="currSymbol">$</span>)</label>
                            <input type="number" step="0.01" id="tradePnl" placeholder="e.g. 55.78 or -15.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs sm:text-sm focus:outline-none focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1" data-i18n="tradesCount">Trades Count</label>
                            <input type="number" id="tradeCount" value="2" min="1" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs sm:text-sm focus:outline-none focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1" data-i18n="notePsychology">Note / Psychology</label>
                            <textarea id="tradeNote" rows="3" placeholder="e.g. Followed strategy" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors text-xs sm:text-sm shadow-md" data-i18n="saveDay">
                            Save Day
                        </button>
                    </form>
                </div>

                <!-- Блок управління бекапом -->
                <div class="bg-slate-900 border border-slate-800 p-4 sm:p-6 rounded-2xl shadow-xl">
                    <h2 class="text-sm font-semibold mb-3 text-slate-300" data-i18n="syncBackup">💾 Sync / Backup</h2>
                    <div class="space-y-2">
                        <button id="exportBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 rounded-lg transition-colors text-xs border border-slate-700" data-i18n="exportBackup">
                            📥 Save Backup File
                        </button>
                        <button id="importBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 rounded-lg transition-colors text-xs border border-slate-700" data-i18n="importBackup">
                            📤 Restore from File
                        </button>
                        <input type="file" id="importFile" accept=".json" class="hidden">
                    </div>
                </div>
            </div>

            <!-- Сітка Календаря -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-3 sm:p-6 rounded-2xl shadow-xl">
                <!-- Панель навігації для тижневого режиму -->
                <div id="weekNavContainer" class="hidden flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                    <button id="prevWeekBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition-colors font-medium">◀ Prev Week</button>
                    <span id="weekRangeLabel" class="text-xs font-bold text-blue-400">Week Range</span>
                    <button id="nextWeekBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition-colors font-medium">Next Week ▶</button>
                </div>

                <div id="weekDaysHeader" class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-[10px] sm:text-xs font-semibold text-slate-400 mb-2 pb-2 border-b border-slate-800">
                    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                </div>
                <div class="overflow-x-auto pb-2">
                    <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2 min-w-[420px]">
                        <!-- Дні генеруються через JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальне вікно редагування дня -->
    <div id="dayModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-2 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl p-4 sm:p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            <h3 id="modalTitle" class="text-base sm:text-lg font-bold text-blue-400 mb-4">Edit Day</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1"><span data-i18n="dayTotalPnl">Day Total P&L</span> (<span class="currSymbol">$</span>)</label>
                        <input type="number" step="0.01" id="modalPnl" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1" data-i18n="notePsychology">Note / Psychology</label>
                        <textarea id="modalNote" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-blue-500" placeholder="Notes..."></textarea>
                    </div>
                </div>
                <div class="border-t border-slate-800 pt-4">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider" data-i18n="tradesDetails">Trades Details:</span>
                        <button type="button" id="addTradeItemBtn" class="bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 text-xs px-3 py-1.5 rounded-lg transition-colors font-medium" data-i18n="addTrade">+ Add Trade</button>
                    </div>
                    <div id="tradesListContainer" class="space-y-3 max-h-60 overflow-y-auto pr-1"></div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button id="saveModalBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors text-sm shadow-md" data-i18n="saveChanges">Save Changes</button>
                    <button id="deleteDayBtn" class="bg-rose-950/50 hover:bg-rose-900/60 border border-rose-700/50 text-rose-300 px-4 py-2.5 rounded-lg transition-colors text-sm" data-i18n="deleteDay">Delete Day</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальне вікно: Крива балансу (Equity Curve) -->
    <div id="chartModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-2 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-3xl rounded-2xl p-4 sm:p-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
            <button id="closeChartModal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
                <h3 class="text-base sm:text-lg font-bold text-blue-400" data-i18n="equityCurveTitle">📊 Equity Curve</h3>
                <div class="flex gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button data-tf="days" class="tf-btn px-3 py-1 text-xs rounded-lg font-medium bg-blue-600 text-white transition-colors" data-i18n="tfDays">By Days</button>
                    <button data-tf="weeks" class="tf-btn px-3 py-1 text-xs rounded-lg font-medium text-slate-400 hover:text-white transition-colors" data-i18n="tfWeeks">By Weeks</button>
                    <button data-tf="months" class="tf-btn px-3 py-1 text-xs rounded-lg font-medium text-slate-400 hover:text-white transition-colors" data-i18n="tfMonths">By Months</button>
                </div>
            </div>
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 relative h-72 sm:h-80">
                <canvas id="equityChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "Calendar Trading Pro", equityCurve: "Equity Curve", balance: "Balance",
                currBalance: "Current Balance", totalPnl: "Total P&L", monthPnl: "Month P&L", weekPnl: "Week P&L",
                winLossDays: "Green / Red Days", winRateDays: "Winrate Days", winRateMonth: "Winrate Month", winRateWeek: "Winrate Week",
                recordDay: "➕ Log Day", date: "Date", netPnl: "Net P&L", tradesCount: "Trades Count",
                notePsychology: "Note / Psychology", saveDay: "Save Day", syncBackup: "💾 Sync / Backup",
                exportBackup: "📥 Save Backup File", importBackup: "📤 Restore from File",
                dayTotalPnl: "Day Total P&L", tradesDetails: "Trades Details:", addTrade: "+ Add Trade",
                saveChanges: "Save Changes", deleteDay: "Delete Day", equityCurveTitle: "📊 Equity Curve",
                tfDays: "By Days", tfWeeks: "By Weeks", tfMonths: "By Months",
                viewMonth: "Month", viewWeek: "Week",
                weekDays: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                fullWeekDays: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                m0: "January", m1: "February", m2: "March", m3: "April", m4: "May", m5: "June",
                m6: "July", m7: "August", m8: "September", m9: "October", m10: "November", m11: "December"
            },
            uk: {
                title: "Calendar Trading Pro", equityCurve: "Крива балансу", balance: "Баланс",
                currBalance: "Поточний баланс", totalPnl: "Загальний P&L", monthPnl: "P&L місяця", weekPnl: "P&L тижня",
                winLossDays: "Зел / Черв дні", winRateDays: "Вінрейт днів", winRateMonth: "Вінрейт місяця", winRateWeek: "Вінрейт тижня",
                recordDay: "➕ Записати день", date: "Дата", netPnl: "Чистий P&L", tradesCount: "Кількість угод",
                notePsychology: "Нотатка / Психологія", saveDay: "Зберегти день", syncBackup: "💾 Синхронізація / Бекап",
                exportBackup: "📥 Зберегти файл бекапу", importBackup: "📤 Відновити з файлу",
                dayTotalPnl: "Загальний P&L дня", tradesDetails: "Деталі угод за день:", addTrade: "+ Додати угоду",
                saveChanges: "Зберегти зміни", deleteDay: "Видалити день", equityCurveTitle: "📊 Крива балансу (Equity Curve)",
                tfDays: "По днях", tfWeeks: "По тижнях", tfMonths: "По місяцях",
                viewMonth: "Місяць", viewWeek: "Тиждень",
                weekDays: ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"],
                fullWeekDays: ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота", "Неділя"],
                m0: "Січень", m1: "Лютий", m2: "Березень", m3: "Квітень", m4: "Травень", m5: "Червень",
                m6: "Липень", m7: "Серпень", m8: "Вересень", m9: "Жовтень", m10: "Листопад", m11: "Грудень"
            },
            de: {
                title: "Calendar Trading Pro", equityCurve: "Equity-Kurve", balance: "Kontostand",
                currBalance: "Aktuelles Guthaben", totalPnl: "Gesamt P&L", monthPnl: "Monat P&L", weekPnl: "Woche P&L",
                winLossDays: "Grüne / Rote Tage", winRateDays: "Trefferquote", winRateMonth: "Trefferquote Monat", winRateWeek: "Trefferquote Woche",
                recordDay: "➕ Tag eintragen", date: "Datum", netPnl: "Netto P&L", tradesCount: "Anzahl Trades",
                notePsychology: "Notiz / Psychologie", saveDay: "Tag Speichern", syncBackup: "💾 Sync / Backup",
                exportBackup: "📥 Backup Speichern", importBackup: "📤 Wiederherstellen",
                dayTotalPnl: "Tages P&L", tradesDetails: "Trade-Details:", addTrade: "+ Trade hinzufügen",
                saveChanges: "Änderungen Speichern", deleteDay: "Tag Löschen", equityCurveTitle: "📊 Equity-Kurve",
                tfDays: "Nach Tagen", tfWeeks: "Nach Wochen", tfMonths: "Nach Monaten",
                viewMonth: "Monat", viewWeek: "Woche",
                weekDays: ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"],
                fullWeekDays: ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"],
                m0: "Januar", m1: "Februar", m2: "März", m3: "April", m4: "Mai", m5: "Juni",
                m6: "Juli", m7: "August", m8: "September", m9: "Oktober", m10: "November", m11: "Dezember"
            }
        };

        const supportedLangs = ['sq','hy','az','eu','be','bs','bg','hr','cs','da','nl','et','fi','fr','ka','el','hu','is','ga','it','lv','lt','lb','mk','mt','no','pl','pt','ro','ru','sr','sk','sl','es','sv','tr','cy'];
        supportedLangs.forEach(lang => {
            if (!translations[lang]) translations[lang] = translations.en;
        });

        let currentLang = 'en';
        function changeLanguage(lang) {
            currentLang = translations[lang] ? lang : 'en';
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');

        function updateStatsLabels() {
            const t = translations[currentLang] || translations.en;
            if (currentViewMode === 'month') {
                document.getElementById('pnlLabelTitle').textContent = t.monthPnl || "Month P&L";
                document.getElementById('winRateLabelTitle').textContent = t.winRateMonth || "Winrate Month";
            } else {
                document.getElementById('pnlLabelTitle').textContent = t.weekPnl || "Week P&L";
                document.getElementById('winRateLabelTitle').textContent = t.winRateWeek || "Winrate Week";
            }
        }

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            const year = parseInt(yearInput.value);
            const month = parseInt(monthSelect.value);
            
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();

            if (currentViewMode === 'month') {
                calendarGrid.className = "grid grid-cols-7 gap-1 sm:gap-1.5 min-w-[420px]";
                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = "bg-slate-950/40 border border-slate-900 rounded-lg p-1.5 min-h-[75px] sm:min-h-[90px] opacity-20";
                    calendarGrid.appendChild(emptyCell);
                }

                for (let day = 1; day <= totalDays; day++) {
                    renderDayCell(year, month, day, "min-h-[75px] sm:min-h-[90px]", false);
                }
            } else {
                calendarGrid.className = "grid grid-cols-1 gap-3 min-w-full";
                
                const currDateObj = new Date(currentWeekBaseDate);
                const dayOfWeek = (currDateObj.getDay() + 6) % 7;
                const weekStartTimestamp = currDateObj.getTime() - (dayOfWeek * 24 * 60 * 60 * 1000);
                
                activeWeekDatesList = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(weekStartTimestamp + (i * 24 * 60 * 60 * 1000));
                    activeWeekDatesList.push(d);
                    renderDayCell(d.getFullYear(), d.getMonth(), d.getDate(), "min-h-[100px] sm:min-h-[120px] p-4", true, i);
                }

                if (activeWeekDatesList.length > 0) {
                    const startD = activeWeekDatesList[0];
                    const endD = activeWeekDatesList[6];
                    weekRangeLabel.textContent = `${startD.getFullYear()}-${pad(startD.getMonth() + 1)}-${pad(startD.getDate())} ➔ ${endD.getFullYear()}-${pad(endD.getMonth() + 1)}-${pad(endD.getDate())}`;
                }
            }
            updateStats();
        }

        function renderDayCell(year, month, day, heightClass, isVerticalWeek = false, weekDayIndex = 0) {
            const dateStr = `${year}-${pad(month + 1)}-${pad(day)}`;
            const dayData = tradingData[dateStr];

            const cell = document.createElement('div');
            const baseHeight = isVerticalWeek ? heightClass : "min-h-[75px] sm:min-h-[90px]";
            cell.className = `bg-slate-950 border border-slate-800/80 rounded-xl p-1.5 sm:p-2 ${baseHeight} flex flex-col justify-between cursor-pointer hover:border-blue-500/50 transition-all shadow-inner relative group overflow-hidden`;
            
            let pnlHtml = `<span class="text-slate-600 text-[10px]">-</span>`;
            if (dayData && dayData.pnl !== undefined && dayData.pnl !== '') {
                const pnlVal = parseFloat(dayData.pnl);
                if (pnlVal > 0) {
                    cell.classList.add('bg-emerald-950/20', 'border-emerald-800/40');
                    if (isVerticalWeek) {
                        pnlHtml = `<span class="text-emerald-400 font-bold text-sm sm:text-lg">+${pnlVal.toFixed(2)} ${currentCurrency}</span>`;
                    } else {
                        pnlHtml = `<span class="text-emerald-400 font-bold text-[11px] sm:text-xs">${pnlVal.toFixed(2)}</span>`;
                    }
                } else if (pnlVal < 0) {
                    cell.classList.add('bg-rose-950/20', 'border-rose-800/40');
                    if (isVerticalWeek) {
                        pnlHtml = `<span class="text-rose-400 font-bold text-sm sm:text-lg">-${Math.abs(pnlVal).toFixed(2)} ${currentCurrency}</span>`;
                    } else {
                        pnlHtml = `<span class="text-rose-400 font-bold text-[11px] sm:text-xs">${Math.abs(pnlVal).toFixed(2)}</span>`;
                    }
                } else {
                    pnlHtml = `<span class="text-slate-400 font-bold text-[11px] sm:text-xs">0.00</span>`;
                }
            }

            const t = translations[currentLang] || translations.en;
            const weekDayName = isVerticalWeek ? (t.fullWeekDays ? t.fullWeekDays[weekDayIndex] : '') : '';

            if (isVerticalWeek) {
                const monthName = t.m0 ? translations[currentLang][`m${month}`] : '';
                cell.innerHTML = `
                    <div class="flex items-center justify-between text-xs sm:text-sm font-medium text-slate-300 border-b border-slate-900 pb-1 mb-1">
                        <span class="font-bold text-blue-400">${weekDayName} <span class="text-slate-400 font-normal">(${day} ${monthName})</span></span>
                        ${dayData && dayData.tradeCount ? `<span class="bg-slate-800 px-2 py-0.5 rounded text-xs text-slate-300 shrink-0">${dayData.tradeCount} trades</span>` : '<span class="text-slate-600 text-xs">0 trades</span>'}
                    </div>
                    <div class="flex items-center justify-between my-auto">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">P&L:</span>
                        <div class="font-bold text-base">${pnlHtml}</div>
                    </div>
                    <div class="text-xs text-slate-400 truncate mt-1 bg-slate-900/60 p-1.5 rounded border border-slate-800/50">
                        <span class="text-slate-500 mr-1">Note:</span>${dayData && dayData.note ? dayData.note : '<span class="italic text-slate-600">No notes</span>'}
                    </div>
                `;
            } else {
                cell.innerHTML = `
                    <div class="flex items-center justify-between text-[11px] font-medium text-slate-300">
                        <span class="font-semibold">${day}</span>
                        ${dayData && dayData.tradeCount ? `<span class="bg-slate-800 px-1 py-0.2 rounded text-[9px] text-slate-300 shrink-0">${dayData.tradeCount}t</span>` : ''}
                    </div>
                    <div class="text-center font-bold my-0.5 truncate">${pnlHtml}</div>
                    <div class="text-[9px] text-slate-400 truncate bg-slate-900/40 px-1 py-0.5 rounded">${dayData && dayData.note ? dayData.note : ''}</div>
                `;
            }
            
            cell.addEventListener('click', () => {
                currentWeekBaseDate = new Date(year, month, day);
                openDayModal(dateStr);
            });
            calendarGrid.appendChild(cell);
        }

        function updateStats() {
            let totalPnl = 0;
            let winDays = 0;
            let lossDays = 0;

            const year = parseInt(yearInput.value);
            const month = parseInt(monthSelect.value);

            if (currentViewMode === 'month') {
                // Статистика за вибраний місяць
                const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
                for (let d = 1; d <= totalDaysInMonth; d++) {
                    const dateStr = `${year}-${pad(month + 1)}-${pad(d)}`;
                    const dayData = tradingData[dateStr];
                    if (dayData && dayData.pnl !== undefined && dayData.pnl !== '') {
                        const val = parseFloat(dayData.pnl) || 0;
                        totalPnl += val;
                        if (val > 0) winDays++;
                        else if (val < 0) lossDays++;
                    }
                }
            } else {
                // Статистика за поточний тиждень
                activeWeekDatesList.forEach(d => {
                    const dateStr = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
                    const dayData = tradingData[dateStr];
                    if (dayData && dayData.pnl !== undefined && dayData.pnl !== '') {
                        const val = parseFloat(dayData.pnl) || 0;
                        totalPnl += val;
                        if (val > 0) winDays++;
                        else if (val < 0) lossDays++;
                    }
                });
            }

            // Розрахунок загального балансу по всій базі угод для правильного відображення в балансі
            let globalTotalPnl = 0;
            Object.values(tradingData).forEach(d => {
                globalTotalPnl += parseFloat(d.pnl) || 0;
            });
            const currentBalance = startBalance + globalTotalPnl;

            const totalLogged = winDays + lossDays;
            const winRate = totalLogged > 0 ? Math.round((winDays / totalLogged) * 100) : 0;

            document.getElementById('currentBalance').textContent = `${currentBalance.toFixed(2)} ${currentCurrency}`;
            const pnlEl = document.getElementById('totalPnl');
            pnlEl.textContent = `${totalPnl >= 0 ? '+' : '-'}${Math.abs(totalPnl).toFixed(2)} ${currentCurrency}`;
            pnlEl.className = `text-lg sm:text-2xl font-bold mt-1 ${totalPnl > 0 ? 'text-emerald-400' : totalPnl < 0 ? 'text-rose-400' : 'text-slate-100'}`;
            
            document.getElementById('winDays').textContent = winDays;
            document.getElementById('lossDays').textContent = lossDays;
            document.getElementById('winRate').textContent = `${winRate}%`;
        }

        document.getElementById('tradeForm').addEventListener('submit', (e) => {

            const date = document.getElementById('tradeDate').value;
            const pnl = parseFloat(document.getElementById('tradePnl').value);

            const note = document.getElementById('tradeNote').value;

            if (!date) return;

            const [y, m, d] = date.split('-').map(Number);
            currentWeekBaseDate = new Date(y, m - 1, d);

            tradingData[date] = {
                pnl: pnl,
                tradesCount: tradesCount,
                note: note,
                trades: [{ pnl: pnl, note: note }]
            };

            localStorage.setItem('tradingData', JSON.stringify(tradingData));
            renderCalendar();
            document.getElementById('tradePnl').value = '';
            document.getElementById('tradeNote').value = '';
        });

        monthSelect.addEventListener('change', () => { 
            currentWeekBaseDate = new Date(parseInt(yearInput.value), parseInt(monthSelect.value), 1);
            renderCalendar(); 
        });
        yearInput.addEventListener('input', () => { 
            currentWeekBaseDate = new Date(parseInt(yearInput.value), parseInt(monthSelect.value), 1);
            renderCalendar(); 
        });

        // Modal Logic
        let activeDate = null;
        const dayModal = document.getElementById('dayModal');
        const modalPnl = document.getElementById('modalPnl');
        const modalNote = document.getElementById('modalNote');
        const tradesListContainer = document.getElementById('tradesListContainer');

        function openDayModal(dateStr) {
            activeDate = dateStr;
            const [y, m, d] = dateStr.split('-').map(Number);
            currentWeekBaseDate = new Date(y, m - 1, d);

            document.getElementById('modalTitle').textContent = `Edit Day: ${dateStr}`;
            const data = tradingData[dateStr] || { pnl: '', note: '', trades: [] };
            modalPnl.value = data.pnl !== undefined ? data.pnl : '';
            modalNote.value = data.note || '';
            
            tradesListContainer.innerHTML = '';
            if (data.trades && data.trades.length > 0) {
                data.trades.forEach((tr) => {
                    addTradeItemRow(tr);
                });
            }
            dayModal.classList.remove('hidden');

        document.getElementById('closeModal').addEventListener('click', () => {

        function addTradeItemRow(tradeData = {}) {
            const row = document.createElement('div');
            row.className = "bg-slate-950 p-3 rounded-xl border border-slate-800 trade-row space-y-2";
            
            const type = tradeData.type || 'Long';
            const symbol = tradeData.symbol || 'XAUUSD';
            const leverage = tradeData.leverage || '1:500';
            const lots = tradeData.lots !== undefined ? tradeData.lots : '0.01';
            const openPrice = tradeData.openPrice !== undefined ? tradeData.openPrice : '';
            const closePrice = tradeData.closePrice !== undefined ? tradeData.closePrice : '';
            const comm = tradeData.comm !== undefined ? tradeData.comm : '0';
            const pnl = tradeData.pnl !== undefined ? tradeData.pnl : '0.00';

            row.innerHTML = `
                <div class="flex flex-wrap gap-2 items-center justify-between">
                    <div class="flex gap-2 items-center">
                        <select class="modal-trade-type bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-blue-400 font-medium focus:outline-none">
                            <option value="Long" ${type === 'Long' ? 'selected' : ''}>Long</option>
                            <option value="Short" ${type === 'Short' ? 'selected' : ''}>Short</option>
                        </select>
                        <input type="text" list="commonSymbols" class="modal-trade-symbol bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-100 font-medium w-24 focus:outline-none" value="${symbol}" placeholder="Symbol">
                        <datalist id="commonSymbols">
                            <option value="XAUUSD">
                            <option value="NAS100">
                            <option value="US500">
                            <option value="BTCUSDT">
                            <option value="EURUSD">
                            <option value="GBPUSD">
                        </datalist>
                        <select class="modal-trade-lev bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-300 focus:outline-none">
                            <option value="1:1" ${leverage === '1:1' ? 'selected' : ''}>1:1</option>
                            <option value="1:10" ${leverage === '1:10' ? 'selected' : ''}>1:10</option>
                            <option value="1:50" ${leverage === '1:50' ? 'selected' : ''}>1:50</option>
                            <option value="1:100" ${leverage === '1:100' ? 'selected' : ''}>1:100</option>
                            <option value="1:200" ${leverage === '1:200' ? 'selected' : ''}>1:200</option>
                            <option value="1:500" ${leverage === '1:500' ? 'selected' : ''}>1:500</option>
                            <option value="1:1000" ${leverage === '1:1000' ? 'selected' : ''}>1:1000</option>
                            <option value="1:2000" ${leverage === '1:2000' ? 'selected' : ''}>1:2000</option>
                            <option value="1:5000" ${leverage === '1:5000' ? 'selected' : ''}>1:5000</option>
                            <option value="1:10000" ${leverage === '1:10000' ? 'selected' : ''}>1:10000</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold modal-trade-pnl-label ${parseFloat(pnl) >= 0 ? 'text-emerald-400' : 'text-rose-400'}">P&L: ${parseFloat(pnl) >= 0 ? '+' : ''}${parseFloat(pnl).toFixed(2)} ${currentCurrency}</span>
                        <button type="button" class="text-rose-400 hover:text-rose-300 font-bold px-1.5 text-sm remove-row-btn">&times;</button>
                    </div>
                </div>
                <div class="grid grid-cols-4 gap-2 text-[10px] text-slate-400 pt-1">
                    <div>
                        <span class="block mb-0.5">Lots</span>
                        <input type="number" step="0.01" class="modal-trade-lots w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs text-slate-100" value="${lots}">
                    </div>
                    <div>
                        <span class="block mb-0.5">Open</span>
                        <input type="number" step="any" class="modal-trade-open w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs text-slate-100" value="${openPrice}">
                    </div>
                    <div>
                        <span class="block mb-0.5">Close</span>
                        <input type="number" step="any" class="modal-trade-close w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs text-slate-100" value="${closePrice}">
                    </div>
                    <div>
                        <span class="block mb-0.5">Comm.</span>
                        <input type="number" step="0.01" class="modal-trade-comm w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs text-slate-100" value="${comm}">
                    </div>
                </div>
            `;

            const calcPnl = () => {
                const l = parseFloat(row.querySelector('.modal-trade-lots').value) || 0;
                const o = parseFloat(row.querySelector('.modal-trade-open').value) || 0;
                const c = parseFloat(row.querySelector('.modal-trade-close').value) || 0;
                const cm = parseFloat(row.querySelector('.modal-trade-comm').value) || 0;
                const t = row.querySelector('.modal-trade-type').value;

                if (o > 0 && c > 0) {
                    let diff = (t === 'Long') ? (c - o) : (o - c);
                    let rawPnl = diff * l * 100 - cm; 
                    const pnlLabel = row.querySelector('.modal-trade-pnl-label');
                    pnlLabel.textContent = `P&L: ${rawPnl >= 0 ? '+' : ''}${rawPnl.toFixed(2)} ${currentCurrency}`;
                    pnlLabel.className = `text-xs font-bold modal-trade-pnl-label ${rawPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
                }
            };

            row.querySelectorAll('input').forEach(input => input.addEventListener('input', calcPnl));
            row.querySelector('.modal-trade-type').addEventListener('change', calcPnl);
            row.querySelector('.remove-row-btn').addEventListener('click', () => row.remove());
            tradesListContainer.appendChild(row);
        }

        document.getElementById('saveModalBtn').addEventListener('click', () => {
            if (!activeDate) return;
            const rows = tradesListContainer.querySelectorAll('.trade-row');
            let trades = [];
            let totalPnl = 0;

            rows.forEach(r => {
                const type = r.querySelector('.modal-trade-type').value;
                const symbol = r.querySelector('.modal-trade-symbol').value || 'XAUUSD';
                const leverage = r.querySelector('.modal-trade-lev').value;
                const lots = parseFloat(r.querySelector('.modal-trade-lots').value) || 0;
                const openPrice = parseFloat(r.querySelector('.modal-trade-open').value) || 0;
                const closePrice = parseFloat(r.querySelector('.modal-trade-close').value) || 0;
                const comm = parseFloat(r.querySelector('.modal-trade-comm').value) || 0;
                
                let p = 0;
                if (openPrice > 0 && closePrice > 0) {
                    let diff = (type === 'Long') ? (closePrice - openPrice) : (openPrice - closePrice);
                    p = diff * lots * 100 - comm;
                }

                trades.push({ type, symbol, leverage, lots, openPrice, closePrice, comm, pnl: p });
                totalPnl += p;
            });

            if (rows.length === 0) {
                totalPnl = parseFloat(modalPnl.value) || 0;
            }

            tradingData[activeDate] = {
                pnl: totalPnl,
                tradesCount: trades.length > 0 ? trades.length : (tradingData[activeDate]?.tradesCount || 1),
                note: modalNote.value,
                trades: trades
            };

            localStorage.setItem('tradingData', JSON.stringify(tradingData));
            dayModal.classList.add('hidden');
            renderCalendar();
        });

        document.getElementById('deleteDayBtn').addEventListener('click', () => {
            if (!activeDate) return;
            delete tradingData[activeDate];
            localStorage.setItem('tradingData', JSON.stringify(tradingData));
            dayModal.classList.add('hidden');
            renderCalendar();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tradingData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "calendar_trading_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            document.getElementById('importFile').click();
        });

        document.getElementById('importFile').addEventListener('change', (e) => {
            const fileReader = new FileReader();
            if (e.target.files[0]) {
                fileReader.readAsText(e.target.files[0], "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        tradingData = JSON.parse(event.target.result);
                        localStorage.setItem('tradingData', JSON.stringify(tradingData));
                        renderCalendar();
                        alert("Backup restored successfully!");
                    } catch (err) {
                        alert("Invalid backup file!");
                    }
                };
            }
        });

            chartModal.classList.remove('hidden');
            renderEquityChart('days');
        });

        document.getElementById('closeChartModal').addEventListener('click', () => {
            chartModal.classList.add('hidden');
        });

        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tf-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white');
                    b.classList.add('text-slate-400');
                });
                e.target.classList.add('bg-blue-600', 'text-white');
                e.target.classList.remove('text-slate-400');
                renderEquityChart(e.target.getAttribute('data-tf'));
            });
        });

        function renderEquityChart(timeframe) {
            const ctx = document.getElementById('equityChart').getContext('2d');
            const sortedDates = Object.keys(tradingData).sort((a, b) => new Date(a) - new Date(b));
            
            let labels = [];
            let dataPoints = [];
            let currentEquity = startBalance;

            sortedDates.forEach(dateStr => {
                currentEquity += parseFloat(tradingData[dateStr].pnl || 0);
                labels.push(dateStr);
                dataPoints.push(currentEquity);
            });

            if (equityChartInstance) {
                equityChartInstance.destroy();
            }

            equityChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length > 0 ? labels : ['Start'],
                    datasets: [{
                        label: `Equity (${currentCurrency})`,
                        data: dataPoints.length > 0 ? dataPoints : [startBalance],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        // Init
        updateCurrencySymbols();
        updateStatsLabels();
        renderCalendar();
    </script>

    <!-- Надійна реєстрація сервіс-воркера -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swUrl = window.location.pathname.includes('calendar-trading-pro') 
                    ? '/calendar-trading-pro/sw.js' 
                    : './sw.js';

                navigator.serviceWorker.register(swUrl)
                    .then(registration => {
                        console.log('✅ ServiceWorker успішно зареєстровано з областю:', registration.scope);
                    })
                    .catch(error => {
                        console.error('❌ Помилка реєстрації ServiceWorker:', error);
                    });
            });
        }
    </script>
</body>
</html>
